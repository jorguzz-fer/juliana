# nginx do site + proxy da API do checkout.
# Este arquivo substitui o /etc/nginx/nginx.conf inteiro dentro do container (ver Dockerfile).
user  nginx;
worker_processes  auto;
pid   /run/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    charset            utf-8;

    # O JSON do checkout e os webhooks da Asaas são pequenos.
    client_max_body_size 256k;

    # ---------- compressão ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------- healthcheck (Coolify) ----------
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------- API do checkout (Node, no mesmo container) ----------
        location ^~ /api/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # ---------- página do pedido: /pedido/<token> ----------
        location ~ "^/pedido/[A-Za-z0-9_-]{16,64}$" {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files /pedido.html =404;
        }

        # ---------- /index.html -> / ----------
        location = /index.html {
            # Só redireciona quando o .html veio na URL digitada. O try_files e o
            # módulo index chegam aqui por redirect interno, e nesses casos o
            # $request_uri continua sendo a URL limpa original.
            if ($request_uri ~ "^/index\.html(\?|$)") { return 301 /; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # ---------- página de erro ----------
        location = /404.html {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # ---------- HTML ----------
        # Serve os arquivos .html e, quando o .html apareceu na URL digitada,
        # redireciona 301 para a URL limpa (evita conteúdo duplicado).
        location ~ \.html$ {
            if ($request_uri ~ "^/(.*)\.html(\?|$)") { return 301 /$1; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # ---------- imagens e fontes ----------
        # 7 dias: as fotos são trocadas na mão, cache longo atrapalharia a troca.
        location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        # ---------- URLs limpas ----------
        # /politica-de-privacidade -> politica-de-privacidade.html
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
    }
}
