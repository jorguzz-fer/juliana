server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------- compressão ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    # ---------- healthcheck (Coolify) ----------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- /index.html -> / ----------
    location = /index.html {
        # Só redireciona quando o .html veio na URL digitada. O try_files e o
        # módulo index chegam aqui por redirect interno, e nesses casos o
        # $request_uri continua sendo a URL limpa original.
        if ($request_uri ~ "^/index\.html(\?|$)") { return 301 /; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- config editável: nunca cachear ----------
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---------- página de erro ----------
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- HTML ----------
    # Serve os arquivos .html e, quando o .html apareceu na URL digitada,
    # redireciona 301 para a URL limpa (evita conteúdo duplicado).
    location ~ \.html$ {
        if ($request_uri ~ "^/(.*)\.html(\?|$)") { return 301 /$1; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- imagens e fontes ----------
    # 7 dias: as fotos são trocadas na mão, cache longo atrapalharia a troca.
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---------- URLs limpas ----------
    # /politica-de-privacidade -> politica-de-privacidade.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
