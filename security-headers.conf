# Incluído em cada bloco location.
# O nginx NÃO herda add_header quando o bloco filho define o seu próprio,
# por isso os cabeçalhos são repetidos via include em vez de declarados
# uma única vez no server.

add_header X-Content-Type-Options   "nosniff"                         always;
add_header X-Frame-Options          "SAMEORIGIN"                      always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

# O CSS e o JS da página são inline, daí 'unsafe-inline'.
# connect-src precisa de https: para o POST em {FUNNEL_API_URL}/leads.
add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
